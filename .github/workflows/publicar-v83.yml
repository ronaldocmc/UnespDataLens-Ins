name: Publicar UnespDataLens-Ins V8.3

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/v8.3/package.b64"
      - ".github/workflows/publicar-v83.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar pacote
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/v8.3/package.b64
          base64 -d bootstrap/v8.3/package.b64 > /tmp/unespdatalens-v8.3.zip
          echo "90c3a3757f0febcadeef3c59ec116c265d91003883d8b9f2f03ebb7fba1d926b  /tmp/unespdatalens-v8.3.zip" | sha256sum -c -

      - name: Expandir V8.3 na raiz
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unespdatalens-unpack
          mkdir -p /tmp/unespdatalens-unpack
          unzip -q /tmp/unespdatalens-v8.3.zip -d /tmp/unespdatalens-unpack
          SRC="$(find /tmp/unespdatalens-unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC"
          test -f "$SRC/instancias/explorar.html"
          test -f "$SRC/assets/js/instancias.js"

          rsync -a --delete \
            --exclude=".git" \
            --exclude=".github" \
            "$SRC/" ./

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>UnespDataLens-Ins</title>
            <meta http-equiv="refresh" content="0; url=instancias/explorar.html?id=educacao-evasao&module=M01">
            <script>
              location.replace("instancias/explorar.html?id=educacao-evasao&module=M01");
            </script>
          </head>
          <body>
            <p>Abrindo <a href="instancias/explorar.html?id=educacao-evasao&module=M01">UnespDataLens-Ins</a>...</p>
          </body>
          </html>
          EOF

          touch .nojekyll

          cat > README.md <<'EOF'
          # UnespDataLens-Ins

          Ambiente interativo de instâncias do **UnespDataLens-RM**.

          ## Versão atual

          **V8.3 — Instância Educacional: Risco de Evasão**

          A aplicação permite explorar os módulos M01–M16 e inspecionar entradas, processamento, saídas, contratos, proveniência, evidências, módulos transversais e arquivos produzidos pela execução.

          ## Abrir

          GitHub Pages:

          https://ronaldocmc.github.io/UnespDataLens-Ins/

          Entrada direta:

          `instancias/explorar.html?id=educacao-evasao&module=M01`
          EOF

      - name: Commit da aplicação expandida
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração a publicar."
            exit 0
          fi
          git commit -m "Publica UnespDataLens-Ins V8.3"
          git push origin main
